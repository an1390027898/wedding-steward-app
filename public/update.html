<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8d1f2d">
  <title>婚礼管家更新</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f3ee;color:#2b2020;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    main{width:min(440px,calc(100% - 32px));padding:28px 22px;border:1px solid #eaded6;border-radius:24px;background:#fff;box-shadow:0 18px 55px rgba(89,48,48,.12);text-align:center}
    .mark{width:58px;height:58px;margin:0 auto 16px;border-radius:18px;background:linear-gradient(135deg,#b84755,#7c1726);display:grid;place-items:center;color:#fff;font-size:28px;font-weight:900}
    h1{font-size:22px;margin:0 0 10px}p{color:#766867;line-height:1.65;margin:0}
    #state{margin-top:16px;font-weight:800;color:#8d1f2d;line-height:1.65}
    button,a.next{display:none;width:100%;min-height:48px;margin-top:18px;border:0;border-radius:14px;background:#8d1f2d;color:#fff;font-size:16px;font-weight:800;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
  </style>
</head>
<body>
  <main>
    <div class="mark">喜</div>
    <h1>正在修复婚礼管家</h1>
    <p>正在移除旧网页程序缓存。客户档案、档期和婚礼资料不会被清除。</p>
    <div id="state">正在处理，请稍候…</div>
    <a class="next" id="next" href="./index.html">打开最新版婚礼管家</a>
    <button id="retry" type="button">重新尝试</button>
  </main>
  <script>
    (async()=>{
      const state=document.getElementById("state"),retry=document.getElementById("retry"),next=document.getElementById("next");
      try{
        if("serviceWorker" in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration=>registration.unregister()));
        }
        if("caches" in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(key=>caches.delete(key)));
        }
        state.innerHTML="旧缓存已经清除。<br>请点击下面按钮进入最新版。";
        next.href="./index.html?fresh=v4-"+Date.now();
        next.style.display="flex";
      }catch(error){
        state.textContent="自动修复没有完成，请点击下面按钮重试。";
        retry.style.display="block";
        retry.onclick=()=>location.reload();
      }
    })();
  </script>
</body>
</html>
